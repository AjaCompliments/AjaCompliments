<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo1 copy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>AJA mobile</title>
    <style>
      #mobileContent {
        display: none;
       width: 100%;
        /* aspect-ratio: 9 / 20; */
      }
      #desktopMessage {
        display: none;
        text-align: center;
        margin-top: 20%;
        font-size: 24px;
        font-family: Arial, sans-serif;
      }
      body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* Optional: Background color for the rest of the window */
        }
    </style>
  </head>
  <body>
    <div id="desktopMessage">Please switch to mobile</div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="mobileContent">
      <div id="root" class="aspect-ratio-box"></div>
    </div>
    <script>
      function detectDevice() {
        var desktopMessage = document.getElementById('desktopMessage');
        var mobileContent = document.getElementById('mobileContent');
        if (window.outerWidth <= (window.innerHeight * 0.92) && window.outerHeight >= (window.innerWidth * 1.1)) {
          // Mobile device
          mobileContent.style.display = 'block';
          desktopMessage.style.display = 'none';
        } else {
          // Desktop device
          mobileContent.style.display = 'none';
          desktopMessage.style.display = 'block';
        }
      }

      // Call the function to detect the device on page load
      detectDevice();

      // Optional: Detect device on window resize
      window.onresize = detectDevice;
      function adjustAspectRatio() {
            var aspectBox = document.getElementById('mobileContent');
            var viewportWidth = window.innerWidth;
            var viewportHeight = window.innerHeight;
            var aspectRatio = 9 / 20;

            // Calculate the dimensions to maintain aspect ratio
            if (viewportWidth / viewportHeight > aspectRatio) {
                // Viewport is wider than aspect ratio
                aspectBox.style.width = viewportHeight * aspectRatio + 'px';
                aspectBox.style.height = viewportHeight + 'px';
            } else {
                // Viewport is taller than aspect ratio
                aspectBox.style.width = viewportWidth + 'px';
                aspectBox.style.height = viewportWidth / aspectRatio + 'px';
            }
        }

        // Call the function to adjust the aspect ratio on page load
        adjustAspectRatio();

        // Optional: Adjust the aspect ratio on window resize
        window.onresize = adjustAspectRatio;
    </script>
  </body>
</html>
